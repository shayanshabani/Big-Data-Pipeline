# src/main/resources/apps/sales-aggregation.properties

# Input/Output Configuration
input.path=hdfs://namenode:8020/streaming/sales/input
checkpoint.path=hdfs://namenode:8020/streaming/sales/checkpoint

# Streaming Configuration
trigger.interval.seconds=10
max.files.per.trigger=1

# Watermark Configuration (for handling late data)
enable.watermark=true
watermark.delay.minutes=10

# Spark Configuration
spark.sql.shuffle.partitions=100
spark.executor.memory=1g
spark.executor.cores=2
spark.driver.memory=512m

# Processing Configuration
output.mode=update
