# src/main/resources/apps/sales-aggregation.properties

# Input/Output Configuration
input.path=/streaming/sales/input
references.path=/references
checkpoint.path=/streaming/sales/checkpoint

# Kafka Configuration
kafka.bootstrap.servers=kafka-1:19092
kafka.topic=streaming-output

# Processing Configuration
trigger.interval.seconds=10
max.files.per.trigger=10

# Watermark Configuration
enable.watermark=true
watermark.delay.minutes=60

# Spark Configuration
spark.sql.shuffle.partitions=100
spark.executor.memory=1g
spark.executor.cores=1
spark.driver.memory=512m
