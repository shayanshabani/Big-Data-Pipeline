  #     - spark-network
  #   healthcheck:
  #     test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5

  # # Kafka Broker 3 (KRaft mode - Controller + Broker)
  # kafka-3:
  #   build:
  #     context: ./kafka
  #     dockerfile: Dockerfile
  #   container_name: kafka-3
  #   hostname: kafka-3
  #   ports:
  #     - "9096:9096"
