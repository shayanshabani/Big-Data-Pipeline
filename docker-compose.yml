  #     - spark-network
  #   healthcheck:
  #     test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9096"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - spark-network
    depends_on:
      - kafka-1
      # - kafka-2
      # - kafka-3

  # Spark Master
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
      - "18080:18080"  # Spark History Server
      - "4040:4040"  # Spark Application UI
    environment:
      - SPARK_MODE=master
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - ./spark/app:/app
      - ./data:/data
      - spark_logs:/spark/logs
      - ./scripts:/external-scripts:ro
    networks:
      - spark-network
    depends_on:
      - namenode
      - resourcemanager
      - kafka-1
      # - kafka-2
      # - kafka-3
    command: ["tail", "-f", "/dev/null"]

  # Spark Client
  spark-client:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-client
    hostname: spark-client
    environment:
      - SPARK_MODE=client
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - ./spark/app:/app
      - ./data:/data
      - ./scripts:/scripts:ro
    networks:
      - spark-network
    depends_on:
      - namenode
      - resourcemanager
      - spark-master
      - kafka-1
      # - kafka-2
      # - kafka-3
    command: ["tail", "-f", "/dev/null"]

  # click house service
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    hostname: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse/
      - clickhouse_logs:/var/log/clickhouse-server/
    networks:
      - spark-network
    depends_on:
      - kafka-1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  spark_logs:
  kafka1_data:
  # kafka2_data:
  # kafka3_data:
  kafka1_logs:
  clickhouse_data:
  clickhouse_logs:
  # kafka2_logs:
  # kafka3_logs:

networks:
  spark-network:
    driver: bridge
