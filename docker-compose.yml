version: '3.8'

services:
  # HDFS NameNode
  namenode:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"  # NameNode Web UI
      - "8020:8020"  # NameNode IPC
    environment:
      - CLUSTER_NAME=hadoop-cluster
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./scripts:/external-scripts:ro
    command: ["/scripts/start-hdfs.sh", "namenode"]
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5

  # HDFS DataNode 1
  datanode1:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: datanode1
    hostname: datanode1
    ports:
      - "9864:9864"  # DataNode Web UI
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - datanode1_data:/hadoop/dfs/data
    command: ["/scripts/start-hdfs.sh", "datanode"]
    networks:
      - spark-network
    depends_on:
      namenode:
        condition: service_started

  # HDFS DataNode 2
  datanode2:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: datanode2
    hostname: datanode2
    ports:
      - "9865:9864"  # DataNode Web UI
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - datanode2_data:/hadoop/dfs/data
    command: ["/scripts/start-hdfs.sh", "datanode"]
    networks:
      - spark-network
    depends_on:
      namenode:
        condition: service_started

  # YARN ResourceManager
  resourcemanager:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: resourcemanager
    hostname: resourcemanager
    ports:
      - "8088:8088"  # ResourceManager Web UI
      - "8030:8030"  # ResourceManager Scheduler
      - "8031:8031"  # ResourceManager Tracker
      - "8032:8032"  # ResourceManager Resource Tracker
    env_file:
      - ./hadoop/hadoop.env
    command: ["/scripts/start-hdfs.sh", "resourcemanager"]
    networks:
      - spark-network
    depends_on:
      - namenode
      - datanode1
      - datanode2

  # YARN NodeManager 1
  nodemanager1:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: nodemanager1
    hostname: nodemanager1
    ports:
      - "8042:8042"  # NodeManager Web UI
    env_file:
      - ./hadoop/hadoop.env
    command: ["/scripts/start-hdfs.sh", "nodemanager"]
    networks:
      - spark-network
    depends_on:
      - resourcemanager

  # YARN NodeManager 2
  nodemanager2:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: nodemanager2
    hostname: nodemanager2
    ports:
      - "8043:8042"  # NodeManager Web UI
    env_file:
      - ./hadoop/hadoop.env
    command: ["/scripts/start-hdfs.sh", "nodemanager"]
    networks:
      - spark-network
    depends_on:
      - resourcemanager

  # Kafka Broker 1 (KRaft mode - Controller + Broker)
  kafka-1:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      # KRaft settings for a single-node cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'Kafka-Cluster-2025'

      # Listener configuration - THE CRITICAL PART
      # Listener for clients inside the docker network (e.g., other services)
      # Listener for clients outside the docker network (e.g., your local machine)
      # Listener for the KRaft controller
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka-1:9093'
      
      # How clients should connect to the broker. This is what Kafka "advertises".
      # Clients connecting via INTERNAL listener will be told to use kafka-1:19092
      # Clients connecting via EXTERNAL listener will be told to use localhost:9092
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092'
      
      # Maps listener names to security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      
      # The listener for broker-to-broker communication. For a single node, it refers to itself.
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

      # --- Replication Settings for a SINGLE broker (These must be 1) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      
      # --- General Topic and Log Settings ---
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: 'lz4'
      
      # --- Performance and Buffer Settings ---
      KAFKA_MAX_REQUEST_SIZE: 10485760
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    volumes:
      - kafka1_data:/var/lib/kafka/data
      - kafka1_logs:/var/log/kafka
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka Broker 2 (KRaft mode - Controller + Broker)
