  #     KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
  #     KAFKA_LISTENERS: 'PLAINTEXT://kafka-2:19092,CONTROLLER://kafka-2:9093,PLAINTEXT_HOST://0.0.0.0:9094'
  #     KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:9094'
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
  #     KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  #     KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  #     KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  #     KAFKA_MIN_INSYNC_REPLICAS: 2
  #     KAFKA_NUM_PARTITIONS: 6
  #     KAFKA_LOG_RETENTION_HOURS: 168
  #     KAFKA_LOG_SEGMENT_BYTES: 1073741824
  #     KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
  #     KAFKA_COMPRESSION_TYPE: 'lz4'
  #     KAFKA_MAX_REQUEST_SIZE: 10485760
  #     KAFKA_MESSAGE_MAX_BYTES: 10485760
